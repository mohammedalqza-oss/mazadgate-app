name: Build MAZAD GATE APK
on:
  push:
    paths: ['MAZAD-GATE-Android.zip', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build signed APK
        env:
          KS_B64: ${{ secrets.MG_KEYSTORE_B64 }}
          MG_KEYSTORE_PASSWORD: ${{ secrets.MG_KEYSTORE_PASSWORD }}
        run: |
          rm -rf src && unzip -q -o MAZAD-GATE-Android.zip -d src
          cd src/android
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"; export MG_KEYSTORE="$RUNNER_TEMP/ks.jks"; fi
          gradle assembleRelease --no-daemon --stacktrace
      - name: Publish APK
        run: |
          mkdir -p dist
          cp src/android/app/build/outputs/apk/release/*.apk dist/MazadGate.apk
          git config user.name "MAZAD GATE Build"
          git config user.email "build@mzadgate.com"
          git add dist/MazadGate.apk
          git commit -m "APK build ${GITHUB_RUN_NUMBER}" || exit 0
          git push
